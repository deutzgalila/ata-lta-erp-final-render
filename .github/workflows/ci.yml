name: CI

on:
  pull_request:
    branches: [uat, main]
  push:
    branches: [uat, main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    # Ephemeral PostgreSQL 15 matching the production major version.
    # Migrations are validated against THIS throwaway database — the pipeline
    # must never connect to the live production database (spec 1.3).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: erp_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # The project applies mixed .js/.sql migrations via the custom runner
      # (scripts/migrate-remote.js), which builds the full schema from scratch
      # on a blank database — node-pg-migrate up alone cannot, since several
      # core tables are created by legacy .sql files.
      - name: Run Schema Migrations Against Ephemeral Test DB
        run: node scripts/migrate-remote.js local
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/erp_test_db
