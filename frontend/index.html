<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATA &amp; LTA ERP</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F4F4F0; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #0A0A0A; padding: 20px;">
        <div style="width: 56px; height: 56px; border-radius: 0px; background: #FAF9F5; box-shadow: 4px 4px 0px #0A0A0A; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 2px solid #0A0A0A;">
          <div style="width: 24px; height: 24px; border: 3px solid #C8C5BC; border-top-color: #E61919; border-radius: 0px; animation: boot-spin 0.8s linear infinite;"></div>
        </div>
        <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; color: #0A0A0A; text-transform: uppercase;">ATA &amp; LTA Accounting Firm ERP</div>
        <div style="font-size: 12px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; color: #4A4945; margin-bottom: 24px;">SYSTEM INITIALIZATION // ENTERPRISE LEDGER</div>
        <div style="width: 220px; height: 6px; background: #EAE8E3; border: 1px solid #0A0A0A; border-radius: 0px; overflow: hidden;">
          <div style="width: 100%; height: 100%; background: #E61919; border-radius: 0px; animation: boot-shimmer 1.5s ease-in-out infinite;"></div>
        </div>
        <style>
          @keyframes boot-spin { to { transform: rotate(360deg); } }
          @keyframes boot-shimmer {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(100%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
